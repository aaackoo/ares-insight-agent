[project]
name = "ares-insight-agent"
version = "0.1.0"
description = "LangGraph agent answering questions about Czech companies from the public ARES register"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
